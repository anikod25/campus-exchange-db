<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Exchange</title>
    <!-- Add Google Fonts: Playfair Display for headings & DM Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h1 class="logo">Campus Exchange</h1>
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-link active" data-target="dashboard">Dashboard</a>
                <a href="#resources" class="nav-link" data-target="resources">Resources</a>
                <a href="#add-resource" class="nav-link" data-target="add-resource">Add Resource</a>
                <a href="#transactions" class="nav-link" data-target="transactions">Transactions</a>
                <a href="#waitlist" class="nav-link" data-target="waitlist">Waitlist</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <section id="dashboard" class="page-section">
                <h2>Dashboard</h2>
            </section>
            
            <section id="resources" class="page-section hidden">
                <h2>Resources</h2>
                
                <div class="card" style="display: flex; gap: 1.5rem; align-items: center; padding: 1rem 1.5rem;">
                    <div>
                        <label for="filter-category" class="stat-label">Category</label>
                        <select id="filter-category" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); font-family: inherit;">
                            <option value="All">All</option>
                            <option value="Textbook">Textbook</option>
                            <option value="Hardware">Hardware</option>
                            <option value="Equipment">Equipment</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-status" class="stat-label">Status</label>
                        <select id="filter-status" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); font-family: inherit;">
                            <option value="All">All</option>
                            <option value="available">Available</option>
                            <option value="borrowed">Borrowed</option>
                            <option value="waitlisted">Waitlisted</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-condition" class="stat-label">Condition</label>
                        <select id="filter-condition" style="padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); font-family: inherit;">
                            <option value="All">All</option>
                            <option value="good">Good</option>
                            <option value="fair">Fair</option>
                            <option value="poor">Poor</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author/Model</th>
                                <th>Category</th>
                                <th>Condition</th>
                                <th>Status</th>
                                <th>Donor</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="resources-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
            
            <section id="add-resource" class="page-section hidden">
                <h2>Add Resource</h2>
            </section>
            
            <section id="transactions" class="page-section hidden">
                <h2>Transactions</h2>
            </section>
            
            <section id="waitlist" class="page-section hidden">
                <h2>Waitlist</h2>
            </section>
        </main>
    </div>

    <script src="mock-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
